# Render Blueprint for the My Project API (https://render.com/docs/blueprint-spec).
# Create it once: Render dashboard → New → Blueprint → this repository. Render then keeps the
# service in sync with this file. Manual steps (database, secrets) are in the README, "Deploy".
services:
  - type: web
    name: full-stack-blueprint-example-api
    runtime: docker
    # Only changes under backend/ redeploy the API.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/healthz
    # Deploy a commit of main only after its GitHub checks (the CI) pass.
    autoDeployTrigger: checksPass
    envVars:
      # Neon connection string (direct, not -pooler; region aws-eu-central-1). Set it in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: MY_PROJECT_ENVIRONMENT
        value: production
      - key: MY_PROJECT_DEMO_ENABLED
        value: "true"
      - key: MY_PROJECT_DB_POOL_MAX_SIZE
        value: "3"
      - key: MY_PROJECT_AGENT_TRACE_CONTENT
        value: "false"
      - key: MY_PROJECT_ORIGIN_SECRET
        sync: false
      # Logfire write token of the project. Without it the API runs but sends no traces.
      - key: LOGFIRE_TOKEN
        sync: false
      # Remains off until the free route, project telemetry and credentials are verified.
      # Runtime enablement is separate so a deploy cannot silently authorize model charges.
      - key: MY_PROJECT_DEMO_CHAT_ENABLED
        sync: false
      - key: MY_PROJECT_DEMO_GATEWAY_ROUTE
        sync: false
      - key: PYDANTIC_AI_GATEWAY_API_KEY
        sync: false
