# Checks on every pull request and every push to main.
#
# The jobs run the same Makefile targets as a local `make check`, so the CI and your machine never
# disagree about what "passing" means. Protect `main` with the required checks `Backend` and
# `Frontend`: they are the two final jobs, which pass when their half passed or was skipped
# because the pull request does not touch it (.github/scripts/what-changed.sh).
#
# Actions are pinned to a commit, with the release in a comment: a tag can be moved to other code,
# a commit cannot. Dependabot updates both (.github/dependabot.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      # Two commits: in a pull request HEAD is the merge with the base, and the diff with its first
      # parent is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Paths changed by the pull request
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ] || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            printf 'backend=true\nfrontend=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames HEAD^1 HEAD | tee "$RUNNER_TEMP/paths.txt"
          .github/scripts/what-changed.sh < "$RUNNER_TEMP/paths.txt" | tee -a "$GITHUB_OUTPUT"

  backend-checks:
    name: Backend · format, lint, types, contract, tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The same image as the local database (docker-compose.yml).
        image: postgres:18-alpine
        # No password: the database lives only for this job and is not reachable from outside.
        env:
          POSTGRES_USER: my_project
          POSTGRES_DB: my_project_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U my_project"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # `uv run` fails instead of updating uv.lock when it is out of date.
      UV_LOCKED: "1"
      TEST_DATABASE_URL: postgresql://my_project@localhost:5432/my_project_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dependencies (uv sync --locked)
        working-directory: backend
        run: uv sync --locked
      - name: make check-backend
        run: make check-backend

  # ty (Astral) replaces pyright as the template's type checker at its 1.0 (copier.yml,
  # type_checker). Until then it runs here for information only: this job always passes, is not a
  # required check, and writes what ty finds to its summary, so the switch holds no surprises.
  ty-preview:
    name: ty preview (informational)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: ty check (never fails the job)
        working-directory: backend
        run: |
          if uv run --locked --with ty ty check --output-format concise > "$RUNNER_TEMP/ty.txt" 2>&1; then
            echo "ty: no diagnostics." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ty found diagnostics (informational)"
              echo '```'
              head -n 200 "$RUNNER_TEMP/ty.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::ty found diagnostics (informational, not required): see the job summary."
          fi

  frontend-checks:
    name: Frontend · format, lint, types, contract, tests, build, Playwright
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies (npm ci)
        run: npm ci
      - name: Installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Only the browser: the runner image already has Chromium's system libraries.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: make check-frontend
        working-directory: .
        run: make check-frontend
      - name: Keep traces and screenshots of failed Playwright tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The required checks. They always run (`always()`): a skipped required check would count as
  # passed. Each job they depend on must have succeeded, or have been skipped because
  # `What changed` said the pull request does not touch that half.
  backend:
    name: Backend
    needs: [changes, backend-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result of the backend checks
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLIES: ${{ needs.changes.outputs.backend }}
          RESULTS: ${{ needs.backend-checks.result }}
        run: &result |
          echo "What changed: $CHANGES · applies: ${APPLIES:-unknown} · results: $RESULTS"
          [ "$CHANGES" = "success" ] || { echo "::error::Could not tell what the pull request changes."; exit 1; }
          case "$APPLIES" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "::error::'What changed' did not say whether this half applies."; exit 1 ;;
          esac
          for result in $RESULTS; do
            [ "$result" = "$expected" ] || { echo "::error::Expected $expected and a job ended $result."; exit 1; }
          done
          echo "OK."

  frontend:
    name: Frontend
    needs: [changes, frontend-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result of the visor checks
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          APPLIES: ${{ needs.changes.outputs.frontend }}
          RESULTS: ${{ needs.frontend-checks.result }}
        run: *result
